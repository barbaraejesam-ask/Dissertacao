<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Indicadores de Saneamento - Santa Catarina</title>
<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --fg:#152a45; --muted:#5b6b80; --line:#dde3ea; --panel:#f5f7fa;
  --v:#2e9e4f; --a:#e8b800; --r:#cf3b35; --n:#c7ced6;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11161d; --fg:#e8edf4; --muted:#9aa7b6; --line:#2a333f; --panel:#18202a; --n:#4a5563;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 2px}
.sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
select,input[type=range]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px}
input[type=range]{min-width:220px;padding:0}
.anos{display:flex;flex-wrap:wrap;gap:6px;max-width:760px}
.anos button{font:inherit;font-size:13px;font-variant-numeric:tabular-nums;padding:5px 9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
.anos button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.mini{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}
.minis{display:flex;gap:12px;margin-top:6px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;position:relative}
.card h2{font-size:13px;margin:0;padding:7px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.card .st{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.mapbox{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
svg{display:block;width:100%;height:auto}
path.mun{stroke:var(--bg);stroke-width:.4;cursor:pointer}
path.mun:hover{stroke:var(--fg);stroke-width:1.2}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px}
.leg span{display:flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .1s;white-space:nowrap}
.foot{margin-top:10px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<h1>Distribuicao espacial dos indicadores de saneamento</h1>
<div class="sub">Santa Catarina | Regulacao por exposicao (ProSun) | SNIS 2003-2022 e SINISA 2023-2024</div>

<div class="ctrl">
  <div class="f"><label for="ind">Indicador</label>
    <select id="ind"></select></div>
</div>
<div class="f" style="margin-bottom:12px">
  <label>Anos (clique para selecionar varios)</label>
  <div class="anos" id="anos"></div>
  <div class="minis">
    <button class="mini" id="btnAll">Selecionar todos</button>
    <button class="mini" id="btnNone">Limpar</button>
    <button class="mini" id="btnMarcos">Marcos legais (2007, 2020, 2024)</button>
    <button class="mini" id="btnUlt">Ultimo ano</button>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="tip" id="tip"></div>

<div class="leg">
  <span><i class="sw" style="background:var(--v)"></i>Satisfatorio <b id="c1"></b></span>
  <span><i class="sw" style="background:var(--a)"></i>Moderado <b id="c2"></b></span>
  <span><i class="sw" style="background:var(--r)"></i>Insatisfatorio <b id="c3"></b></span>
  <span><i class="sw" style="background:var(--n)"></i>Sem dados <b id="c0"></b></span>
</div>
<div class="foot" id="foot"></div>
</div>

<script id="geo" type="application/json">__GEOJSON__</script>
<script id="dados" type="application/json">__DADOS__</script>
<script>
const GEO = JSON.parse(document.getElementById('geo').textContent);
const DB  = JSON.parse(document.getElementById('dados').textContent);
const NOMES = {};
const LABEL = {
 IN023:'IN023 - Atendimento urbano de agua',
 IN024:'IN024 - Atendimento urbano de esgoto',
 IN016:'IN016 - Tratamento de esgoto',
 IN084:'IN084 - Coliformes fora do padrao',
 IN082:'IN082 - Extravasamentos de esgoto',
 IN049:'IN049 - Perdas na distribuicao',
 IN009:'IN009 - Indice de hidrometracao',
 IN011:'IN011 - Indice de macromedicao'
};
const ORDEM = ['IN023','IN024','IN016','IN084','IN082','IN049','IN009','IN011'];
const CORES = {0:'var(--n)',1:'var(--v)',2:'var(--a)',3:'var(--r)'};
const NOME_CL = {0:'Sem dados',1:'Satisfatorio',2:'Moderado',3:'Insatisfatorio'};

// projecao equirretangular ajustada ao bounding box de SC
const W=1000,H=560,PAD=14;
let minx=180,maxx=-180,miny=90,maxy=-90;
function eachRing(geom,fn){
  const t=geom.type, c=geom.coordinates;
  if(t==='Polygon') c.forEach(fn);
  else if(t==='MultiPolygon') c.forEach(p=>p.forEach(fn));
}
GEO.features.forEach(f=>eachRing(f.geometry,r=>r.forEach(p=>{
  if(p[0]<minx)minx=p[0]; if(p[0]>maxx)maxx=p[0];
  if(p[1]<miny)miny=p[1]; if(p[1]>maxy)maxy=p[1];
})));
const latm=Math.cos((miny+maxy)/2*Math.PI/180);
const gw=(maxx-minx)*latm, gh=(maxy-miny);
const s=Math.min((W-2*PAD)/gw,(H-2*PAD)/gh);
const ox=(W-gw*s)/2, oy=(H-gh*s)/2;
const px=p=>[ox+(p[0]-minx)*latm*s, oy+(maxy-p[1])*s];
function ringPath(r){
  let d='';
  for(let i=0;i<r.length;i++){const q=px(r[i]); d+=(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}
  return d+'Z';
}
function pathOf(geom){let d='';eachRing(geom,r=>{d+=ringPath(r)});return d;}

const tip=document.getElementById('tip');
const grid=document.getElementById('grid');
const NS='http://www.w3.org/2000/svg';
const DPATH={}, NOMES_OK=[];
GEO.features.forEach(f=>{
  NOMES[f.properties.id]=f.properties.name;
  DPATH[f.properties.id]=pathOf(f.geometry);
  NOMES_OK.push(f.properties.id);
});

const selInd=document.getElementById('ind');
ORDEM.filter(i=>DB.data[i]).forEach(i=>{
  const o=document.createElement('option'); o.value=i; o.textContent=LABEL[i]||i; selInd.appendChild(o);
});
selInd.value='IN023';

const ANOS=[]; for(let a=2003;a<=2024;a++) ANOS.push(a);
let sel=new Set([2024]);
const barra=document.getElementById('anos');
ANOS.forEach(a=>{
  const b=document.createElement('button');
  b.type='button'; b.textContent=a; b.dataset.ano=a;
  b.setAttribute('aria-pressed', sel.has(a));
  b.addEventListener('click',()=>{ sel.has(a)?sel.delete(a):sel.add(a); sync(); });
  barra.appendChild(b);
});
function sync(){
  [...barra.children].forEach(b=>b.setAttribute('aria-pressed', sel.has(+b.dataset.ano)));
  render();
}
document.getElementById('btnAll').onclick=()=>{ANOS.forEach(a=>sel.add(a));sync()};
document.getElementById('btnNone').onclick=()=>{sel.clear();sync()};
document.getElementById('btnMarcos').onclick=()=>{sel=new Set([2007,2020,2024]);sync()};
document.getElementById('btnUlt').onclick=()=>{sel=new Set([2024]);sync()};

function estado(id,ano){
  const m=DB.data[selInd.value][ano];
  const v=m&&m[id];
  return v?v:[0,null];
}
function mapaDe(ano){
  const card=document.createElement('div'); card.className='card';
  const cnt={0:0,1:0,2:0,3:0};
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label','Mapa de Santa Catarina em '+ano);
  NOMES_OK.forEach(id=>{
    const st=estado(id,ano); cnt[st[0]]++;
    const el=document.createElementNS(NS,'path');
    el.setAttribute('d',DPATH[id]); el.setAttribute('class','mun');
    el.setAttribute('fill',CORES[st[0]]);
    el.addEventListener('mousemove',ev=>{
      tip.innerHTML=NOMES[id]+' ('+ano+')<br>'+(st[1]===null||st[1]===undefined?'sem valor':st[1]+'%')+' - '+NOME_CL[st[0]];
      tip.style.left=(ev.clientX+12)+'px';
      tip.style.top=(ev.clientY+window.scrollY+12)+'px';
      tip.style.opacity=1;
    });
    el.addEventListener('mouseleave',()=>{tip.style.opacity=0});
    svg.appendChild(el);
  });
  const tot=NOMES_OK.length;
  const h2=document.createElement('h2');
  h2.innerHTML=ano+'<span class="st">'+(tot-cnt[0])+'/'+tot+' com dado | '+cnt[1]+' verde, '+cnt[2]+' amarelo, '+cnt[3]+' vermelho</span>';
  card.appendChild(h2); card.appendChild(svg);
  return [card,cnt];
}
function render(){
  grid.innerHTML='';
  const anos=[...sel].sort((a,b)=>a-b);
  const tt={0:0,1:0,2:0,3:0};
  if(!anos.length){
    grid.innerHTML='<div style="padding:28px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px">Selecione ao menos um ano acima.</div>';
  }
  grid.style.gridTemplateColumns = anos.length===1
    ? '1fr'
    : 'repeat(auto-fit,minmax('+(anos.length<=4?'380px':'260px')+',1fr))';
  anos.forEach(a=>{
    const [card,cnt]=mapaDe(a);
    grid.appendChild(card);
    [0,1,2,3].forEach(k=>tt[k]+=cnt[k]);
  });
  const tot=NOMES_OK.length*(anos.length||1);
  [0,1,2,3].forEach(k=>{
    document.getElementById('c'+k).textContent=tt[k]+' ('+(tt[k]*100/tot).toFixed(1)+'%)';
  });
  document.getElementById('foot').textContent=
    (LABEL[selInd.value]||selInd.value)+' | '+anos.length+' ano(s) selecionado(s)'+
    (anos.length?': '+anos.join(', '):'')+' | contadores da legenda somam todos os mapas exibidos.';
}
selInd.addEventListener('change',render);
render();
</script>
</body>
</html>
